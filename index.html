<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sunny Game — 50 предметов, 30 NPC</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1e2a1f;
            margin: 0;
            padding: 16px;
            color: #f5e7d9;
            min-height: 100vh;
        }
        .npc-card {
            background: #2c3e2a;
            border-radius: 28px;
            padding: 14px 16px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #ffd966;
            cursor: pointer;
        }
        .npc-name {
            font-size: 20px;
            font-weight: bold;
            color: #ffd966;
        }
        .npc-wants {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .want-item {
            background: #3e5a3b;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
        }
        .npc-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 16px;
            max-height: 120px;
            overflow-y: auto;
        }
        .npc-btn {
            background: #3e5a3b;
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.1s;
        }
        .npc-btn.active {
            background: #ffd966;
            color: #1e2a1f;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            background: #2a3a27;
            padding: 12px;
            border-radius: 28px;
        }
        .cell {
            aspect-ratio: 1 / 1;
            background: #3a2e28;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 2px solid #6b4e3a;
            text-align: center;
            word-break: break-word;
            padding: 4px;
        }
        .cell.selected {
            border: 3px solid #ffb347;
            background: #5e4b3a;
            transform: scale(0.97);
        }
        .info-panel {
            background: #2c2b26;
            border-radius: 28px;
            padding: 12px 16px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .coins {
            background: #ffd966;
            color: #2c2b26;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
        }
        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 8px 0;
        }
        button {
            background: #5e7c5a;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { transform: scale(0.95); }
        .sell-btn { background: #b86f2c; }
        .reset-btn { background: #5a3e2e; }
        .craft-locked { opacity: 0.6; filter: grayscale(0.3); }
        .note { font-size: 10px; text-align: center; margin-top: 16px; opacity: 0.7; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="npcSelector" class="npc-selector"></div>
<div id="npcCard" class="npc-card"></div>

<div class="grid" id="grid"></div>

<div class="info-panel">
    <span>🔮 Соединяй одинаковые предметы</span>
    <span class="coins" id="coinsDisplay">💰 100</span>
</div>

<div class="buttons" id="craftButtons">
    <button id="craftMaterials" data-cost="0" data-unlock="trava,brevno,kamen,zhelezo,med,ser,bro,zoloto,platina,mitril,adamant">🌿 Материалы</button>
    <button id="craftFood" data-cost="500" data-unlock="yagoda,sok,hleb,syr,tort,pir,sup,myaso,uha,picca">🍎 Еда</button>
    <button id="craftArmor" data-cost="1000" data-unlock="kozha,shit,shlem,kira,ponogi,sapogi,ruka,plasch,laty,bronya">🛡️ Броня</button>
    <button id="craftWeapon" data-cost="1500" data-unlock="mech,topor,luk,arbalet,kope,molet,kinzhal,posoh,sekira,mech_geroya">⚔️ Оружие</button>
    <button id="craftPotion" data-cost="2000" data-unlock="zelie1,zelie2,zelie3,elix,poison,lechenie,mana,sila,nevidim,besmertie">🧪 Зелья</button>
</div>

<div class="buttons">
    <button id="sellToNpcBtn" class="sell-btn">💎 Продать текущему NPC</button>
    <button id="resetGameBtn" class="reset-btn">🔄 Сброс игры</button>
</div>
<div class="note">⚡ Новые NPC и предметы открываются после покупки кнопок крафта! Всего 50 предметов, 30 NPC.</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ---------- ВСЕ 50 ПРЕДМЕТОВ ----------
    const allItems = {
        // Материалы (10)
        "trava": { name: "🌿 Трава", price: 1, type: "material", unlocked: true },
        "brevno": { name: "🪵 Бревно", price: 2, type: "material", unlocked: true },
        "kamen": { name: "🪨 Камень", price: 5, type: "material", unlocked: false },
        "zhelezo": { name: "⛏️ Железо", price: 10, type: "material", unlocked: false },
        "med": { name: "🔶 Медь", price: 15, type: "material", unlocked: false },
        "ser": { name: "⚪ Серебро", price: 20, type: "material", unlocked: false },
        "bro": { name: "🟡 Бронза", price: 25, type: "material", unlocked: false },
        "zoloto": { name: "🟡 Золото", price: 30, type: "material", unlocked: false },
        "platina": { name: "⚪ Платина", price: 40, type: "material", unlocked: false },
        "mitril": { name: "🔵 Мифрил", price: 50, type: "material", unlocked: false },
        "adamant": { name: "🟣 Адамантий", price: 60, type: "material", unlocked: false },
        
        // Еда (10)
        "yagoda": { name: "🍓 Ягода", price: 3, type: "food", unlocked: false },
        "sok": { name: "🧃 Сок", price: 8, type: "food", unlocked: false },
        "hleb": { name: "🍞 Хлеб", price: 15, type: "food", unlocked: false },
        "syr": { name: "🧀 Сыр", price: 12, type: "food", unlocked: false },
        "tort": { name: "🍰 Торт", price: 30, type: "food", unlocked: false },
        "pir": { name: "🥧 Пирог", price: 25, type: "food", unlocked: false },
        "sup": { name: "🍲 Суп", price: 18, type: "food", unlocked: false },
        "myaso": { name: "🍖 Мясо", price: 20, type: "food", unlocked: false },
        "uha": { name: "🐟 Уха", price: 22, type: "food", unlocked: false },
        "picca": { name: "🍕 Пицца", price: 35, type: "food", unlocked: false },

        // Броня (10)
        "kozha": { name: "🧥 Кожа", price: 8, type: "armor", unlocked: false },
        "shit": { name: "🛡️ Щит", price: 20, type: "armor", unlocked: false },
        "shlem": { name: "⛑️ Шлем", price: 25, type: "armor", unlocked: false },
        "kira": { name: "🦺 Кираса", price: 35, type: "armor", unlocked: false },
        "ponogi": { name: "🦵 Поножи", price: 30, type: "armor", unlocked: false },
        "sapogi": { name: "👢 Сапоги", price: 15, type: "armor", unlocked: false },
        "ruka": { name: "🧤 Наручи", price: 18, type: "armor", unlocked: false },
        "plasch": { name: "🧥 Плащ", price: 28, type: "armor", unlocked: false },
        "laty": { name: "🛡️ Латы", price: 45, type: "armor", unlocked: false },
        "bronya": { name: "🐉 Броня дракона", price: 100, type: "armor", unlocked: false },

        // Оружие (10)
        "mech": { name: "⚔️ Меч", price: 40, type: "weapon", unlocked: false },
        "topor": { name: "🪓 Топор", price: 35, type: "weapon", unlocked: false },
        "luk": { name: "🏹 Лук", price: 30, type: "weapon", unlocked: false },
        "arbalet": { name: "🔫 Арбалет", price: 45, type: "weapon", unlocked: false },
        "kope": { name: "🔱 Копьё", price: 38, type: "weapon", unlocked: false },
        "molet": { name: "🔨 Молот", price: 42, type: "weapon", unlocked: false },
        "kinzhal": { name: "🗡️ Кинжал", price: 25, type: "weapon", unlocked: false },
        "posoh": { name: "🪄 Посох", price: 50, type: "weapon", unlocked: false },
        "sekira": { name: "⚔️ Секира", price: 55, type: "weapon", unlocked: false },
        "mech_geroya": { name: "⭐ Меч героя", price: 120, type: "weapon", unlocked: false },

        // Зелья (10)
        "zelie1": { name: "🧪 Малое зелье", price: 10, type: "potion", unlocked: false },
        "zelie2": { name: "🧪 Среднее зелье", price: 20, type: "potion", unlocked: false },
        "zelie3": { name: "🧪 Большое зелье", price: 35, type: "potion", unlocked: false },
        "elix": { name: "✨ Эликсир", price: 50, type: "potion", unlocked: false },
        "poison": { name: "☠️ Яд", price: 25, type: "potion", unlocked: false },
        "lechenie": { name: "💊 Зелье лечения", price: 30, type: "potion", unlocked: false },
        "mana": { name: "🔮 Зелье маны", price: 30, type: "potion", unlocked: false },
        "sila": { name: "💪 Зелье силы", price: 40, type: "potion", unlocked: false },
        "nevidim": { name: "👻 Невидимость", price: 60, type: "potion", unlocked: false },
        "besmertie": { name: "♾️ Бессмертие", price: 200, type: "potion", unlocked: false }
    };

    // Правила слияния (по цепочкам внутри категорий)
    const mergeRules = {
        "trava": "brevno", "brevno": "kamen", "kamen": "zhelezo", "zhelezo": "med",
        "med": "ser", "ser": "bro", "bro": "zoloto", "zoloto": "platina", "platina": "mitril", "mitril": "adamant",
        "yagoda": "sok", "sok": "hleb", "hleb": "syr", "syr": "tort", "tort": "pir", "pir": "sup", "sup": "myaso", "myaso": "uha", "uha": "picca",
        "kozha": "shit", "shit": "shlem", "shlem": "kira", "kira": "ponogi", "ponogi": "sapogi", "sapogi": "ruka", "ruka": "plasch", "plasch": "laty", "laty": "bronya",
        "mech": "topor", "topor": "luk", "luk": "arbalet", "arbalet": "kope", "kope": "molet", "molet": "kinzhal", "kinzhal": "posoh", "posoh": "sekira", "sekira": "mech_geroya",
        "zelie1": "zelie2", "zelie2": "zelie3", "zelie3": "elix", "elix": "poison", "poison": "lechenie", "lechenie": "mana", "mana": "sila", "sila": "nevidim", "nevidim": "besmertie"
    };

    // ---------- 30 NPC ----------
    const npcTemplates = [
        { name: "🧺 Фермер Джон", unlockItem: null, unlockCoins: 0 },
        { name: "⚒️ Кузнец Торин", unlockItem: "kamen", unlockCoins: 0 },
        { name: "🧙 Волшебник Мерлин", unlockItem: "zelie1", unlockCoins: 0 },
        { name: "🛡️ Рыцарь Артур", unlockItem: "mech", unlockCoins: 0 },
        { name: "🍎 Повар Гарри", unlockItem: "hleb", unlockCoins: 0 },
        { name: "🌲 Лесник Элронд", unlockItem: "brevno", unlockCoins: 0 },
        { name: "⛏️ Шахтёр Балин", unlockItem: "zhelezo", unlockCoins: 0 },
        { name: "🧪 Алхимик Снейп", unlockItem: "zelie2", unlockCoins: 0 },
        { name: "🐉 Дракон Сириус", unlockCoins: 500 },
        { name: "👑 Король Артур", unlockCoins: 1000 },
        { name: "🧝 Эльфийка Луна", unlockCoins: 1500 },
        { name: "🧌 Тролль Грог", unlockCoins: 2000 },
        { name: "🦉 Мудрая Сова", unlockCoins: 2500 },
        { name: "⚡ Громовержец Тор", unlockItem: "mech_geroya", unlockCoins: 3000 },
        { name: "🌙 Лунная Жрица", unlockCoins: 3500 },
        { name: "🔥 Повелитель Огня", unlockItem: "bronya", unlockCoins: 4000 },
        { name: "💎 Торговец Гоблин", unlockCoins: 4500 },
        { name: "🐺 Вождь волков", unlockItem: "myaso", unlockCoins: 5000 },
        { name: "🏴‍☠️ Капитан Блад", unlockCoins: 6000 },
        { name: "🧟 Некромант Мор", unlockItem: "poison", unlockCoins: 7000 },
        { name: "👹 Демон Варг", unlockCoins: 8000 },
        { name: "🧚 Фея Динь", unlockCoins: 9000 },
        { name: "👑 Император", unlockCoins: 10000 },
        { name: "🐉 Король драконов", unlockItem: "besmertie", unlockCoins: 15000 },
        { name: "⭐ Хранитель времени", unlockCoins: 20000 },
        { name: "🌌 Космический странник", unlockCoins: 30000 },
        { name: "🌀 Архимаг", unlockCoins: 40000 },
        { name: "💀 Бог смерти", unlockCoins: 50000 },
        { name: "✨ Создатель миров", unlockCoins: 100000 },
        { name: "🎲 Господин Удачи", unlockCoins: 500000 }
    ];

    let npcs = [];
    let currentNpcIndex = 0;
    let grid = [];
    let coins = 100;
    let selectedIndex = null;
    let unlockedItems = ["trava", "brevno"];

    function generateRandomWants() {
        const available = Object.keys(allItems).filter(key => allItems[key].unlocked);
        const count = Math.min(5, Math.max(3, available.length));
        const shuffled = [...available];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const wants = {};
        for (let i = 0; i < count; i++) {
            const item = shuffled[i];
            wants[item] = Math.floor(allItems[item].price * (5 + Math.random() * 5));
        }
        return wants;
    }

    function initNPCs() {
        npcs = npcTemplates.map(template => {
            let unlocked = true;
            if (template.unlockItem && !unlockedItems.includes(template.unlockItem)) unlocked = false;
            if (template.unlockCoins > coins) unlocked = false;
            return {
                ...template,
                wants: generateRandomWants(),
                unlocked: unlocked
            };
        });
    }

    function refreshNPCs() {
        npcs.forEach(npc => {
            let unlocked = true;
            if (npc.unlockItem && !unlockedItems.includes(npc.unlockItem)) unlocked = false;
            if (npc.unlockCoins > coins) unlocked = false;
            npc.unlocked = unlocked;
            if (npc.unlocked && (!npc.wants || Object.keys(npc.wants).length === 0)) {
                npc.wants = generateRandomWants();
            }
        });
        if (!npcs[currentNpcIndex]?.unlocked) {
            const newIndex = npcs.findIndex(n => n.unlocked);
            currentNpcIndex = newIndex !== -1 ? newIndex : 0;
        }
        renderNPCSelector();
        renderCurrentNPC();
    }

    function renderNPCSelector() {
        const container = document.getElementById("npcSelector");
        container.innerHTML = "";
        npcs.forEach((npc, idx) => {
            if (!npc.unlocked) return;
            const btn = document.createElement("div");
            btn.className = "npc-btn" + (currentNpcIndex === idx ? " active" : "");
            btn.textContent = npc.name;
            btn.onclick = () => { currentNpcIndex = idx; renderCurrentNPC(); renderNPCSelector(); };
            container.appendChild(btn);
        });
    }

    function renderCurrentNPC() {
        const npc = npcs[currentNpcIndex];
        if (!npc) return;
        const wantsHtml = Object.entries(npc.wants).map(([item, price]) => 
            `<span class="want-item">${allItems[item]?.name || item} → ${price} 🪙</span>`
        ).join("");
        document.getElementById("npcCard").innerHTML = `
            <div class="npc-name">${npc.name}</div>
            <div class="npc-wants">${wantsHtml || "<span>— пока ничего не покупает —</span>"}</div>
        `;
    }

    function initGrid() {
        grid = new Array(16).fill(null);
        for (let i = 0; i < Math.min(12, unlockedItems.length); i++) {
            if (grid[i] === null) grid[i] = unlockedItems[i % unlockedItems.length];
        }
        for (let i = 0; i < grid.length; i++) {
            if (grid[i] === null) grid[i] = "trava";
        }
    }

    function saveGame() {
        localStorage.setItem("sunnyGrid", JSON.stringify(grid));
        localStorage.setItem("sunnyCoins", coins);
        localStorage.setItem("sunnyUnlocked", JSON.stringify(unlockedItems));
    }

    function loadGame() {
        const savedGrid = localStorage.getItem("sunnyGrid");
        const savedCoins = localStorage.getItem("sunnyCoins");
        const savedUnlocked = localStorage.getItem("sunnyUnlocked");
        if (savedGrid) grid = JSON.parse(savedGrid);
        if (savedCoins) coins = parseInt(savedCoins);
        if (savedUnlocked) unlockedItems = JSON.parse(savedUnlocked);
        Object.keys(allItems).forEach(key => {
            allItems[key].unlocked = unlockedItems.includes(key);
        });
        initNPCs();
        refreshNPCs();
        renderAll();
    }

    function renderAll() {
        renderGrid();
        document.getElementById("coinsDisplay").innerHTML = `💰 ${coins}`;
        refreshNPCs();
    }

    function renderGrid() {
        const container = document.getElementById("grid");
        container.innerHTML = "";
        for (let i = 0; i < grid.length; i++) {
            const itemKey = grid[i];
            const display = allItems[itemKey]?.name || "❓";
            const cell = document.createElement("div");
            cell.className = "cell";
            if (selectedIndex === i) cell.classList.add("selected");
            cell.textContent = display;
            cell.onclick = (function(idx) { return () => onCellClick(idx); })(i);
            container.appendChild(cell);
        }
    }

    function onCellClick(index) {
        if (selectedIndex === null) {
            selectedIndex = index;
            renderGrid();
            return;
        }
        const firstIdx = selectedIndex;
        const secondIdx = index;
        selectedIndex = null;
        if (firstIdx === secondIdx) { renderGrid(); return; }
        const firstItem = grid[firstIdx];
        const secondItem = grid[secondIdx];
        if (firstItem === secondItem && mergeRules[firstItem] && allItems[mergeRules[firstItem]]?.unlocked) {
            const newItem = mergeRules[firstItem];
            grid[firstIdx] = newItem;
            grid[secondIdx] = newItem;
            coins += 2;
            saveGame();
            renderAll();
        } else {
            renderGrid();
        }
    }

    function sellToCurrentNPC() {
        const npc = npcs[currentNpcIndex];
        if (!npc || !npc.wants) return;
        let sold = false;
        for (let i = 0; i < grid.length; i++) {
            const item = grid[i];
            if (npc.wants[item]) {
                coins += npc.wants[item];
                grid[i] = null;
                sold = true;
            }
        }
        if (sold) {
            saveGame();
            renderAll();
            tg.showPopup({ title: "✅ Продано!", message: `${npc.name} купил предметы`, buttons: [{type: "ok"}] });
        } else {
            tg.showPopup({ title: "Нет товара", message: `Нет предметов для ${npc.name}`, buttons: [{type: "ok"}] });
        }
    }

    function unlockCraft(cost, itemsToUnlock) {
        if (coins < cost) {
            tg.showPopup({ title: "Нет монет", message: `Нужно ${cost} монет`, buttons: [{type: "ok"}] });
            return false;
        }
        coins -= cost;
        itemsToUnlock.split(",").forEach(item => {
            if (!unlockedItems.includes(item)) {
                unlockedItems.push(item);
                allItems[item].unlocked = true;
            }
        });
        saveGame();
        renderAll();
        tg.showPopup({ title: "🔓 Открыто!", message: `Доступны новые предметы и NPC`, buttons: [{type: "ok"}] });
        return true;
    }

    function resetGame() {
        unlockedItems = ["trava", "brevno"];
        Object.keys(allItems).forEach(key => {
            allItems[key].unlocked = unlockedItems.includes(key);
        });
        coins = 100;
        initGrid();
        saveGame();
        initNPCs();
        refreshNPCs();
        renderAll();
        tg.showPopup({ title: "🔄 Сброс", message: "Игра перезапущена", buttons: [{type: "ok"}] });
    }

    document.getElementById("craftMaterials").onclick = () => unlockCraft(0, "trava,brevno,kamen,zhelezo,med,ser,bro,zoloto,platina,mitril,adamant");
    document.getElementById("craftFood").onclick = () => unlockCraft(500, "yagoda,sok,hleb,syr,tort,pir,sup,myaso,uha,picca");
    document.getElementById("craftArmor").onclick = () => unlockCraft(1000, "kozha,shit,shlem,kira,ponogi,sapogi,ruka,plasch,laty,bronya");
    document.getElementById("craftWeapon").onclick = () => unlockCraft(1500, "mech,topor,luk,arbalet,kope,molet,kinzhal,posoh,sekira,mech_geroya");
    document.getElementById("craftPotion").onclick = () => unlockCraft(2000, "zelie1,zelie2,zelie3,elix,poison,lechenie,mana,sila,nevidim,besmertie");
    document.getElementById("sellToNpcBtn").onclick = sellToCurrentNPC;
    document.getElementById("resetGameBtn").onclick = resetGame;

    initGrid();
    loadGame();
</script>
</body>
</html>
